name: Rust quality and PostgreSQL
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.93.0
          components: rustfmt,clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Compile native inference adapter without downloading model weights
        run: cargo check -p kf-app --features inference --locked
      - run: cargo install --locked cargo-nextest --version 0.9.103
      - run: cargo nextest run --workspace --locked
      - run: cargo test --workspace --doc --locked
      - name: Compile synthetic conversion and pagination benchmarks
        run: cargo check -p kf-ingest --benches --locked
      - name: Install pinned audit tools
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.22.2
      - run: cargo deny --all-features check
      - name: Audit with two reviewed named exceptions
        # docs/security.md / ADR-001: paste is compile-time unmaintained;
        # rsa exists only in Cargo.lock. cargo-deny's all-platform graph bans rsa.
        # These are accepted findings, not security fixes or a clean raw audit.
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2023-0071
      - name: Scan public history for secrets
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          go install github.com/zricethezav/gitleaks/v8@v${GITLEAKS_VERSION}
          "$HOME/go/bin/gitleaks" git --redact --no-banner
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.93.0
      - name: Build pinned native test dependency
        run: docker build --tag kf-test-postgres deploy/postgres
      - name: Start disposable synthetic database
        run: |
          docker run -d --name kf-test-postgres -p 127.0.0.1:55433:5432 -e POSTGRES_DB=knowledge_forge -e POSTGRES_PASSWORD=ci-only-synthetic-password kf-test-postgres
          for attempt in $(seq 1 30); do
            if docker exec kf-test-postgres pg_isready -U postgres; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Bootstrap isolated roles and vector extension
        run: |
          docker exec -i kf-test-postgres psql -X -U postgres -d knowledge_forge -v ON_ERROR_STOP=1 < deploy/postgres/bootstrap.sql
          docker exec kf-test-postgres psql -X -U postgres -d knowledge_forge -v ON_ERROR_STOP=1 -c 'CREATE DATABASE kf_test_store OWNER kf_owner'
          docker exec kf-test-postgres psql -X -U postgres -d kf_test_store -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION vector; ALTER SCHEMA public OWNER TO kf_owner'
      - name: Required PostgreSQL integration tests
        env:
          KF_TEST_DATABASE_URL: postgresql://postgres:ci-only-synthetic-password@127.0.0.1:55433/kf_test_store
        run: cargo test -p kf-store --test postgres --locked -- --ignored
      - name: Cleanup ephemeral database
        if: always()
        run: docker rm -f kf-test-postgres
